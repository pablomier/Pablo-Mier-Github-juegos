<style>
/* Layout: one narrow study column, like a page of notes, with the five exercises on a bar at the thumb. */
:root {
  --paper: #F1F4FA;
  --surface: #FFFFFF;
  --ink: #16203A;
  --muted: #58637E;
  --line: #D5DBE9;
  --accent: #2743C8;
  --on-accent: #FFFFFF;
  --tint: #E4E9FB;
  --mark: #FFE45C;
  --on-mark: #16203A;
  --good: #17794E;
  --good-bg: #DDF3E8;
  --bad: #B93127;
  --bad-bg: #FBE3E0;
  --display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1323; --surface: #182036; --ink: #E9ECF6; --muted: #9BA6C2; --line: #2B3554;
    --accent: #93A5FF; --on-accent: #0E1323; --tint: #222C4D; --mark: #FFE45C; --on-mark: #16203A;
    --good: #5FD09B; --good-bg: #143326; --bad: #FF8E84; --bad-bg: #3D1B18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1323; --surface: #182036; --ink: #E9ECF6; --muted: #9BA6C2; --line: #2B3554;
  --accent: #93A5FF; --on-accent: #0E1323; --tint: #222C4D; --mark: #FFE45C; --on-mark: #16203A;
  --good: #5FD09B; --good-bg: #143326; --bad: #FF8E84; --bad-bg: #3D1B18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.app {
  max-width: 640px; margin: 0 auto; padding-block: 20px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 20px;
}
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
.streak { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.02em; }
h2 { font-family: var(--display); font-weight: 600; font-size: 19px; margin: 0; text-wrap: balance; }
p { margin: 0; }
.lead { color: var(--muted); max-width: 60ch; }
.label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

/* CEFR track */
.track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.bar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.seg-t { display: flex; justify-content: space-between; font-size: 14px; font-variant-numeric: tabular-nums; }
.seg-t b { font-family: var(--display); }
.seg-t span { color: var(--muted); }

/* Today's plan */
.tasks { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.task { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
.task-t { font-weight: 700; }
.task-d { display: block; color: var(--muted); font-size: 14px; font-weight: 400; }
.task-go { color: var(--accent); font-weight: 700; font-size: 14px; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); }
.check.done { border-color: var(--good); background: var(--good); position: relative; }
.check.done::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: rotate(45deg); }

/* Flashcard and panels */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.word { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1.1; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.ex { font-size: 18px; }
mark { background: var(--mark); color: var(--on-mark); padding: 0 3px; border-radius: 3px; }
.meaning { font-size: 20px; font-weight: 700; color: var(--accent); border-top: 1px dashed var(--line); padding-top: 14px; }
.note { color: var(--muted); font-size: 15px; }
.chip { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 8px; border-radius: 999px; background: var(--tint); color: var(--accent); }
.meta { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--muted); flex-wrap: wrap; font-variant-numeric: tabular-nums; }

button, .btn { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 700; text-decoration: none; text-align: center; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.good { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.btn.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.grid3 .btn { padding-inline: 6px; font-size: 15px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Grammar */
.topics { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.topic { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 14px 0; background: none; border: 0; border-bottom: 1px solid var(--line); color: inherit; text-align: left; }
.topic b { display: block; }
.topic small { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.explain { background: var(--tint); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.explain i { font-style: normal; font-weight: 700; color: var(--accent); }
.q { font-size: 20px; font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { min-height: 48px; padding: 10px 14px; text-align: left; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 17px; }
.opt.right { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 700; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.why { border-left: 3px solid var(--line); padding-left: 12px; color: var(--muted); }

/* Phrases and writing */
input[type="text"], textarea { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
textarea { min-height: 220px; resize: vertical; line-height: 1.6; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg-ctl button { min-height: 40px; padding: 6px 14px; border: 0; background: transparent; color: var(--muted); font-weight: 700; }
.seg-ctl button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.diff { font-size: 19px; line-height: 1.7; }
.diff .ok { color: var(--good); }
.diff .miss { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; font-weight: 700; }
.prompt { font-size: 19px; font-weight: 700; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.count.ok { color: var(--good); font-weight: 700; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tabs a { display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 700; }
.tabs a[aria-current="page"] { background: var(--tint); color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width 0.4s ease; } }
</style>

/* ---------- State ---------- */
const LEVELS = ["B1","B2","C1"];
const INTERVALS = [0,1,3,7,16,35];   // days until the next review, by box
const NEW_PER_DAY = 10;
const TARGET = new Date(2027, 8, 1);
const KEY = "camino-c1-v1";
const blank = () => ({cards:{}, newDay:{day:0,n:0,extra:0}, grammar:{}, phrases:{}, drafts:{}, days:{}, prefs:{fl:"B1", fi:{B1:0,B2:0,C1:0}, wl:"B1", wi:{B1:0,B2:0,C1:0}, mode:""}});
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) { const o = JSON.parse(raw); S = Object.assign(blank(), o); S.prefs = Object.assign(blank().prefs, o.prefs || {}); } } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const today = () => { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); };
const day = () => { const t = today(); return S.days[t] || (S.days[t] = {cards:0, grammar:0, phrases:0, write:0}); };
const active = t => { const d = S.days[t]; return !!d && (d.cards || d.grammar || d.phrases || d.write) > 0; };
function streak() { let t = today(), n = 0; if (!active(t)) t--; while (active(t)) { n++; t--; } return n; }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Speech ---------- */
const canSpeak = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
function speak(text, rate) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[\[\]]/g, ""));
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /^en[-_]GB/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang));
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
    u.rate = rate || 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- Vocabulary (spaced repetition) ---------- */
let V = {queue:null, revealed:false, day:0};
function newAllowance() {
  const t = today();
  if (S.newDay.day !== t) S.newDay = {day:t, n:0, extra:0};
  return Math.max(0, NEW_PER_DAY + S.newDay.extra - S.newDay.n);
}
function cardCounts() {
  const t = today();
  const due = VOCAB.filter(c => S.cards[c[1]] && S.cards[c[1]].due <= t).length;
  const unseen = VOCAB.filter(c => !S.cards[c[1]]).length;
  return {due, fresh: Math.min(unseen, newAllowance()), unseen};
}
function buildQueue() {
  const t = today();
  const due = VOCAB.filter(c => S.cards[c[1]] && S.cards[c[1]].due <= t);
  const fresh = VOCAB.filter(c => !S.cards[c[1]]).slice(0, newAllowance());
  V = {queue: due.concat(fresh), revealed:false, day:t};
}
function rate(how) {
  const c = V.queue.shift(); if (!c) return;
  const t = today(), id = c[1];
  let st = S.cards[id];
  if (!st) { st = S.cards[id] = {box:0, due:t}; newAllowance(); S.newDay.n++; }
  if (how === "yes") { st.box = Math.min(5, st.box + 1); st.due = t + INTERVALS[st.box]; }
  else if (how === "almost") { st.box = Math.max(1, st.box); st.due = t + 1; }
  else { st.box = 0; st.due = t; V.queue.push(c); }
  day().cards++;
  V.revealed = false;
  save();
}
function levelPct(lv) {
  const cards = VOCAB.filter(c => c[0] === lv);
  const known = cards.filter(c => S.cards[c[1]] && S.cards[c[1]].box >= 3).length;
  const topics = GRAMMAR.filter(g => g.level === lv);
  const g = topics.reduce((n, x) => n + (S.grammar[x.id] || 0) / x.qs.length, 0);
  return Math.round(100 * (0.6 * known / cards.length + 0.4 * g / topics.length));
}
function viewPalabras() {
  if (!V.queue || V.day !== today()) buildQueue();
  const c = V.queue[0];
  const seen = Object.keys(S.cards).length;
  const strong = VOCAB.filter(x => S.cards[x[1]] && S.cards[x[1]].box >= 3).length;
  const head = `<div class="stack"><h1>Palabras</h1><p class="lead">Cada palabra vuelve justo antes de que la olvides: al día siguiente, a los 3 días, a la semana…</p></div>`;
  const foot = `<p class="meta"><span>${seen} de ${VOCAB.length} vistas</span><span>${strong} bien aprendidas</span></p>`;
  if (!c) {
    const left = VOCAB.filter(x => !S.cards[x[1]]).length;
    return head + `<div class="card"><h2>Has terminado las palabras de hoy</h2>
      <p class="lead">Vuelve mañana para repasarlas. ${left ? "Si te quedan ganas, puedes adelantar algunas nuevas." : "Ya has visto todo el mazo."}</p>
      ${left ? `<button class="btn ghost" data-act="more">Ver 5 palabras nuevas más</button>` : ""}</div>` + foot;
  }
  const isNew = !S.cards[c[1]];
  const ex = esc(c[3]).replace(/\[/g, "<mark>").replace(/\]/g, "</mark>");
  return head + `<div class="card">
      <div class="meta"><span class="chip">${c[0]}</span><span>${isNew ? "Nueva" : "Repaso"}</span><span>Quedan ${V.queue.length}</span></div>
      <div class="word">${esc(c[1])}</div>
      <p class="ex">${ex}</p>
      ${canSpeak ? `<div class="row"><button class="btn quiet small" data-act="say" data-text="${esc(c[1])}">Escuchar palabra</button><button class="btn quiet small" data-act="say" data-text="${esc(c[3])}">Escuchar frase</button></div>` : ""}
      ${V.revealed ? `<div class="meaning">${esc(c[2])}</div>${c[4] ? `<p class="note">${esc(c[4])}</p>` : ""}` : ""}
    </div>
    ${V.revealed
      ? `<div class="grid3"><button class="btn bad" data-act="rate" data-how="no">No la sabía</button><button class="btn quiet" data-act="rate" data-how="almost">Casi</button><button class="btn good" data-act="rate" data-how="yes">La sabía</button></div>`
      : `<button class="btn" data-act="reveal">Ver significado</button>`}` + foot;
}

/* ---------- Grammar ---------- */
let G = {topic:null};
function startTopic(id) {
  const t = GRAMMAR.find(x => x.id === id);
  G = {topic:t, i:0, score:0, picked:null, opts:shuffle(t.qs[0][1]), done:false};
}
function viewGramatica() {
  if (!G.topic) {
    return `<div class="stack"><h1>Gramática</h1><p class="lead">Cada tema tiene una explicación corta y cinco preguntas. Con 4 aciertos el tema cuenta como superado.</p></div>` +
      LEVELS.map(lv => `<div class="stack"><div class="label">Nivel ${lv}</div><div class="topics">` +
        GRAMMAR.filter(g => g.level === lv).map(g => {
          const b = S.grammar[g.id];
          return `<button class="topic" data-act="topic" data-id="${g.id}"><span><b>${esc(g.title)}</b><small>${b == null ? "Sin empezar" : `Mejor resultado: ${b} de ${g.qs.length}`}</small></span><span class="check ${b >= 4 ? "done" : ""}"></span></button>`;
        }).join("") + `</div></div>`).join("");
  }
  const t = G.topic;
  const back = `<button class="btn quiet small" data-act="topics">Volver a los temas</button>`;
  if (G.done) {
    return `<div class="stack"><div class="row">${back}</div><h1>${G.score} de ${t.qs.length}</h1>
      <p class="lead">${G.score >= 4 ? "Tema superado." : "Repasa la explicación y vuelve a intentarlo: necesitas 4 aciertos."}</p></div>
      <div class="explain">${t.exp.map(p => `<p>${p}</p>`).join("")}</div>
      <button class="btn" data-act="topic" data-id="${t.id}">Repetir el tema</button>`;
  }
  const q = t.qs[G.i];
  return `<div class="stack"><div class="row">${back}</div><div class="meta"><span class="chip">${t.level}</span><span>Pregunta ${G.i + 1} de ${t.qs.length}</span></div><h2>${esc(t.title)}</h2></div>
    ${G.i === 0 && G.picked == null ? `<div class="explain">${t.exp.map(p => `<p>${p}</p>`).join("")}</div>` : ""}
    <p class="q">${esc(q[0])}</p>
    <div class="opts">${G.opts.map(o => {
      let cls = "";
      if (G.picked != null) cls = o === q[1][0] ? "right" : (o === G.picked ? "wrong" : "");
      return `<button class="opt ${cls}" data-act="pick" data-opt="${esc(o)}" ${G.picked != null ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>
    ${G.picked != null ? `<p class="why">${G.picked === q[1][0] ? "Correcto. " : "No es esa. "}${esc(q[2])}</p><button class="btn" data-act="nextq">${G.i + 1 < t.qs.length ? "Siguiente pregunta" : "Ver resultado"}</button>` : ""}`;
}
function pick(o) {
  if (G.picked != null) return;
  G.picked = o;
  if (o === G.topic.qs[G.i][1][0]) G.score++;
}
function nextQ() {
  const t = G.topic;
  if (G.i + 1 < t.qs.length) { G.i++; G.picked = null; G.opts = shuffle(t.qs[G.i][1]); return; }
  G.done = true;
  S.grammar[t.id] = Math.max(S.grammar[t.id] || 0, G.score);
  day().grammar++;
  save();
}

/* ---------- Phrases: dictation and translation ---------- */
let F = {input:"", result:null};
const cleanWord = w => w.toLowerCase().replace(/[’‘`]/g, "'").replace(/[^a-z0-9']/g, "");
function compare(target, answer) {
  const orig = target.split(/\s+/), T = orig.map(cleanWord), A = answer.split(/\s+/).map(cleanWord).filter(Boolean);
  const n = T.length, m = A.length;
  const L = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = T[i] === A[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ok = new Array(n).fill(false); let i = 0, j = 0, hits = 0;
  while (i < n && j < m) { if (T[i] === A[j]) { ok[i] = true; hits++; i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  return {orig, ok, pct: Math.round(100 * hits / Math.max(n, m, 1))};
}
function phraseMode() { return S.prefs.mode || (canSpeak ? "listen" : "translate"); }
function viewFrases() {
  const lv = S.prefs.fl, list = PHRASES[lv], i = S.prefs.fi[lv] % list.length, p = list[i], mode = phraseMode();
  const r = F.result;
  return `<div class="stack"><h1>Frases</h1><p class="lead">${mode === "listen" ? "Escucha la frase y escríbela tal como suena. Es el mejor entrenamiento para entender clases en inglés." : "Traduce la frase al inglés y compárala con la respuesta modelo."}</p></div>
    <div class="row">
      <div class="seg-ctl" role="group" aria-label="Nivel">${LEVELS.map(l => `<button data-act="flevel" data-lv="${l}" aria-pressed="${l === lv}">${l}</button>`).join("")}</div>
      <div class="seg-ctl" role="group" aria-label="Modo">${canSpeak ? `<button data-act="fmode" data-mode="listen" aria-pressed="${mode === "listen"}">Escuchar</button>` : ""}<button data-act="fmode" data-mode="translate" aria-pressed="${mode === "translate"}">Traducir</button></div>
    </div>
    ${!canSpeak ? `<p class="note">Este navegador no tiene voz en inglés, así que el dictado no está disponible aquí.</p>` : ""}
    <div class="card">
      <div class="meta"><span class="chip">${lv}</span><span>Frase ${i + 1} de ${list.length}</span></div>
      ${mode === "listen"
        ? `<div class="row"><button class="btn" data-act="say" data-text="${esc(p[0])}">Escuchar</button><button class="btn ghost" data-act="say" data-rate="0.7" data-text="${esc(p[0])}">Más despacio</button></div>`
        : `<p class="ex">${esc(p[1])}</p>`}
      <input type="text" id="phrase-input" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Escribe la frase en inglés" value="${esc(F.input)}" aria-label="Tu respuesta en inglés">
      ${r ? `<div class="stack"><div class="label">${mode === "listen" ? "La frase era" : "Respuesta modelo"} · ${r.pct}% igual</div>
          <p class="diff">${r.orig.map((w, k) => `<span class="${r.ok[k] ? "ok" : "miss"}">${esc(w)}</span>`).join(" ")}</p>
          ${mode === "listen" ? `<p class="note">${esc(p[1])}</p>` : `<p class="note">Puede haber otras traducciones correctas. Fíjate en las palabras subrayadas.</p>`}</div>` : ""}
    </div>
    ${r ? `<button class="btn" data-act="fnext">Siguiente frase</button>` : `<button class="btn" data-act="fcheck">Comprobar</button>`}`;
}
function checkPhrase() {
  const el = $("#phrase-input"); F.input = el ? el.value : "";
  if (!F.input.trim()) return;
  const lv = S.prefs.fl, list = PHRASES[lv], i = S.prefs.fi[lv] % list.length;
  F.result = compare(list[i][0], F.input);
  const k = lv + i; S.phrases[k] = Math.max(S.phrases[k] || 0, F.result.pct);
  if (F.result.pct >= 60) day().phrases++;
  save();
}

/* ---------- Writing ---------- */
function wordCount(s) { const m = s.trim().match(/\S+/g); return m ? m.length : 0; }
function viewEscribir() {
  const lv = S.prefs.wl, list = WRITING[lv], i = S.prefs.wi[lv] % list.length, t = list[i];
  const text = S.drafts[lv + i] || "", n = wordCount(text);
  return `<div class="stack"><h1>Escribir</h1><p class="lead">Escribe sin traductor. Después copia el texto y pégalo en tu conversación con Claude para que te lo corrija y te explique los errores.</p></div>
    <div class="row">
      <div class="seg-ctl" role="group" aria-label="Nivel">${LEVELS.map(l => `<button data-act="wlevel" data-lv="${l}" aria-pressed="${l === lv}">${l}</button>`).join("")}</div>
      <button class="btn quiet small" data-act="wnext">Otro tema</button>
    </div>
    <div class="stack">
      <div class="meta"><span class="chip">${lv}</span><span>Tema ${i + 1} de ${list.length}</span></div>
      <p class="prompt">${esc(t[0])}</p>
      <textarea id="draft" spellcheck="false" placeholder="Write your answer here…" aria-label="Tu texto en inglés">${esc(text)}</textarea>
      <div class="spread"><span class="count ${n >= t[1] ? "ok" : ""}" id="wcount">${n} de ${t[1]} palabras</span><span class="count" id="copied" aria-live="polite"></span></div>
    </div>
    <button class="btn" data-act="copy">Copiar para corregir</button>`;
}
function onDraft(el) {
  const lv = S.prefs.wl, i = S.prefs.wi[lv] % WRITING[lv].length, min = WRITING[lv][i][1];
  S.drafts[lv + i] = el.value;
  const n = wordCount(el.value), c = $("#wcount");
  if (c) { c.textContent = `${n} de ${min} palabras`; c.classList.toggle("ok", n >= min); }
  if (n >= min) day().write = 1;
  save();
}
function copyDraft() {
  const lv = S.prefs.wl, i = S.prefs.wi[lv] % WRITING[lv].length, el = $("#draft"), out = $("#copied");
  if (!el || !el.value.trim()) { if (out) out.textContent = "Escribe algo primero"; return; }
  const msg = `Corrige este texto en inglés (nivel ${lv}). Explícame cada error en español y dame una versión mejorada.\n\nTask: ${WRITING[lv][i][0]}\n\n${el.value.trim()}`;
  const fallback = () => { el.focus(); el.select(); if (out) out.textContent = "Texto seleccionado: cópialo a mano"; };
  try { navigator.clipboard.writeText(msg).then(() => { if (out) out.textContent = "Copiado"; }, fallback); } catch (e) { fallback(); }
}

/* ---------- Today ---------- */
function viewHoy() {
  const d = S.days[today()] || {}, cc = cardCounts();
  const left = Math.max(0, Math.ceil((TARGET - new Date()) / 86400000));
  const cardsDone = (d.cards || 0) > 0 && cc.due + cc.fresh === 0;
  const nextT = GRAMMAR.find(g => (S.grammar[g.id] || 0) < 4);
  const task = (href, done, title, detail) => `<a class="task" href="#${href}"><span class="check ${done ? "done" : ""}"></span><span class="task-t">${title}<span class="task-d">${detail}</span></span><span class="task-go">${done ? "Hecho" : "Empezar"}</span></a>`;
  const cardText = cardsDone ? "Terminadas por hoy" : [cc.due ? `${cc.due} para repasar` : "", cc.fresh ? `${cc.fresh} nuevas` : ""].filter(Boolean).join(" y ") || "Nada pendiente";
  return `<div class="stack"><h1>Faltan ${left} días para septiembre de 2027</h1><p class="lead">Unos 20 minutos aquí cada día, más todo el inglés que puedas escuchar y leer fuera.</p></div>
    <div class="stack"><div class="label">Plan de hoy</div><div class="tasks">
      ${task("palabras", cardsDone, "Palabras", cardText)}
      ${task("gramatica", (d.grammar || 0) > 0, "Gramática", nextT ? esc(nextT.title) + " · " + nextT.level : "Todos los temas superados")}
      ${task("frases", (d.phrases || 0) >= 3, "Frases", `${Math.min(d.phrases || 0, 3)} de 3 frases`)}
      ${task("escribir", !!d.write, "Escribir", "Un texto corto para corregir")}
    </div></div>
    <div class="stack"><div class="label">Tu avance por nivel</div>
      <div class="track">${LEVELS.map(lv => { const p = levelPct(lv); return `<div class="seg"><div class="bar"><i style="width:${p}%"></i></div><div class="seg-t"><b>${lv}</b><span>${p}%</span></div></div>`; }).join("")}</div>
      <p class="note">Sube cuando aprendes bien las palabras de cada nivel y superas sus temas de gramática. Es una guía de esta aplicación, no un examen oficial.</p>
    </div>`;
}

/* ---------- Routing and events ---------- */
const VIEWS = {hoy:viewHoy, palabras:viewPalabras, gramatica:viewGramatica, frases:viewFrases, escribir:viewEscribir};
function route() { const h = location.hash.replace("#", ""); return VIEWS[h] ? h : "hoy"; }
function render() {
  const r = route();
  $("#main").innerHTML = VIEWS[r]();
  document.querySelectorAll("#tabs a").forEach(a => { if (a.getAttribute("href") === "#" + r) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const n = streak();
  $("#streak").textContent = n ? `Racha: ${n} ${n === 1 ? "día" : "días"}` : "Empieza tu racha hoy";
}
window.addEventListener("hashchange", () => { F.result = null; F.input = ""; render(); window.scrollTo(0, 0); });
$("#main").addEventListener("input", e => { if (e.target.id === "draft") onDraft(e.target); });
$("#main").addEventListener("keydown", e => { if (e.target.id === "phrase-input" && e.key === "Enter") { if (F.result) nextPhrase(); else checkPhrase(); render(); } });
function nextPhrase() { const lv = S.prefs.fl; S.prefs.fi[lv] = (S.prefs.fi[lv] + 1) % PHRASES[lv].length; F = {input:"", result:null}; save(); }
$("#main").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "say") { speak(b.dataset.text, parseFloat(b.dataset.rate) || 0); return; }
  if (a === "copy") { copyDraft(); return; }
  if (a === "reveal") V.revealed = true;
  else if (a === "rate") rate(b.dataset.how);
  else if (a === "more") { newAllowance(); S.newDay.extra += 5; save(); buildQueue(); }
  else if (a === "topic") startTopic(b.dataset.id);
  else if (a === "topics") G = {topic:null};
  else if (a === "pick") pick(b.dataset.opt);
  else if (a === "nextq") nextQ();
  else if (a === "flevel") { S.prefs.fl = b.dataset.lv; F = {input:"", result:null}; save(); }
  else if (a === "fmode") { S.prefs.mode = b.dataset.mode; F = {input:"", result:null}; save(); }
  else if (a === "fcheck") checkPhrase();
  else if (a === "fnext") nextPhrase();
  else if (a === "wlevel") { S.prefs.wl = b.dataset.lv; save(); }
  else if (a === "wnext") { const lv = S.prefs.wl; S.prefs.wi[lv] = (S.prefs.wi[lv] + 1) % WRITING[lv].length; save(); }
  render();
});
if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
render();
</script>
</html>
